name: Build 32-bit AntiGem

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Patch Go runtime for 32-bit Android
        run: |
          GOROOT=$(go env GOROOT)
          echo "Patching GOROOT: $GOROOT"
          cd $GOROOT/src/runtime
          sed -i 's/if !isFutexTime32bitOnly.Load() {/if GOOS != "android" \&\& !isFutexTime32bitOnly.Load() {/' os_linux32.go
          sed -i 's/if !isSetTime32bitOnly.Load() {/if GOOS != "android" \&\& !isSetTime32bitOnly.Load() {/' os_linux32.go
          
          # Recompile the standard library for Android/ARM with the patch applied
          cd $GOROOT/src
          GOOS=android GOARCH=arm GOARM=7 go install std

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Add NDK to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Grant Execute Permission
        run: chmod +x gradlew
      
      - name: Build Standard Debug APK
        run: ./gradlew assembleStandardDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Standard-32bit
          path: app/build/outputs/apk/standard/debug/*.apk
