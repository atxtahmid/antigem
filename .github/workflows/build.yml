name: Build 32-bit AntiGem

on: 
  workflow_dispatch: # This lets you click a button to start the build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          
      - name: Grant Execute Permission
        run: chmod +x gradlew
      
      - name: Build Standard Debug APK
        # This tells Gradle to build ONLY the standard flavor
        run: ./gradlew assembleStandardDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Standard-32bit
          path: app/build/outputs/apk/standard/debug/*.apk
