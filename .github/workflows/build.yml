name: Build 32-bit AntiGem

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # NEW: Setup the Android NDK for CGO cross-compilation
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      # NEW: Install the ARM GCC compiler for CGO
      - name: Install GCC ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Grant Execute Permission
        run: chmod +x gradlew
      
      - name: Build Standard Debug APK
        run: ./gradlew assembleStandardDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Standard-32bit
          path: app/build/outputs/apk/standard/debug/*.apk
