name: Build 32-bit AntiGem

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Patch Go runtime for 32-bit Android
        run: |
          GOROOT=$(go env GOROOT)
          echo "Patching GOROOT: $GOROOT"
          cd $GOROOT/src/runtime
          
          # Patch the assembly file to use the standard futex syscall instead of futex_time64
          sed -i 's/SYS_futex_time64/SYS_futex/g' sys_linux_arm.s
          
          # Verify the patch
          grep -n "SYS_futex" sys_linux_arm.s

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Add NDK to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Grant Execute Permission
        run: chmod +x gradlew
      
      - name: Build Standard Debug APK
        run: ./gradlew assembleStandardDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Standard-32bit
          path: app/build/outputs/apk/standard/debug/*.apk
